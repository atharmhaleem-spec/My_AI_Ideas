<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Horizon - Game Center</title>
    <style>
        body {
            margin: 0;
            background: #0a0a12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }
        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
        }
        button:hover, button.active {
            background: #00ffff;
            color: #0a0a12;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        #game-container {
            position: relative;
            background: #020208;
            border: 3px solid #1f1f38;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.1);
        }
        canvas {
            display: block;
            background: #05050d;
        }
        .score-board {
            text-align: center;
            font-size: 20px;
            margin-top: 10px;
            color: #00ffaa;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>AI HORIZON ARCADE</h1>
    
    <div class="menu">
        <button id="btn-defender" class="active" onclick="switchGame('defender')">AI Core Defender</button>
        <button id="btn-snake" onclick="switchGame('snake')">Cyber Snake</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
    </div>
    <div class="score-board">Score: <span id="scoreVal">0</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        
        let currentGame = 'defender';
        let score = 0;
        let gameInterval;
        let isRunning = true;

        // --- GLOBAL INPUT CONTROLS ---
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Touch/Click support for Mobile
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            if (currentGame === 'defender') {
                player.x = touchX - player.width / 2;
            }
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            if (currentGame === 'defender') {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, w: 4, h: 10 });
            }
        });

        // --- GAME 1: AI CORE DEFENDER VARIABLES & LOGIC ---
        let player = { x: 180, y: 450, width: 40, height: 15, speed: 5 };
        let bullets = [];
        let enemies = [];
        let enemySpawnTimer = 0;

        function updateDefender() {
            // Player movement
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;
            if (keys['Space']) {
                keys['Space'] = false; // Prevent rapid continuous fire
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, w: 4, h: 10 });
            }

            // Move Bullets
            bullets.forEach((b, index) => {
                b.y -= 7;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Spawn Enemies (Corrupted Data Blocks)
            enemySpawnTimer++;
            if (enemySpawnTimer % 40 === 0) {
                enemies.push({ x: Math.random() * (canvas.width - 25), y: -20, w: 25, h: 25, speed: 2 });
            }

            // Move Enemies
            enemies.forEach((enemy, eIdx) => {
                enemy.y += enemy.speed;
                
                // Check for Game Over (Enemy hits bottom)
                if (enemy.y > canvas.height) {
                    gameOver();
                }

                // Bullet Collision detection
                bullets.forEach((bullet, bIdx) => {
                    if (bullet.x < enemy.x + enemy.w &&
                        bullet.x + bullet.w > enemy.x &&
                        bullet.y < enemy.y + enemy.h &&
                        bullet.y + bullet.h > enemy.y) {
                        
                        // Collision hit! Remove enemy & bullet, up score
                        enemies.splice(eIdx, 1);
                        bullets.splice(bIdx, 1);
                        score += 10;
                        scoreVal.innerText = score;
                    }
                });
            });
        }

        function drawDefender() {
            // Draw Player Shield
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';

            // Draw Bullets
            ctx.fillStyle = '#00ffaa';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Draw Enemies
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
            ctx.shadowBlur = 0; // Reset blur
        }

        // --- GAME 2: CYBER SNAKE VARIABLES & LOGIC ---
        let gridSize = 20;
        let snake = [{ x: 160, y: 240 }, { x: 140, y: 240 }];
        let dx = gridSize;
        let dy = 0;
        let food = { x: 80, y: 80 };
        let snakeSpeedCounter = 0;

        // Mobile swipe helper for Snake
        window.addEventListener('keydown', e => {
            if (currentGame !== 'snake') return;
            if (e.code === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.code === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
            if (e.code === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.code === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
        });

        function updateSnake() {
            snakeSpeedCounter++;
            if (snakeSpeedCounter % 7 !== 0) return; // Control grid speed clock

            // Head setup
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Eat check
            if (head.x === food.x && head.y === food.y) {
                score += 5;
                scoreVal.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }

            // Hit boundaries
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
            }

            // Hit self
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) gameOver();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
        }

        function drawSnake() {
            // Draw Snake
            ctx.fillStyle = '#00ffaa';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffaa';
            snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2));

            // Draw Data Packet Food
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffff00';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }

        // --- SYSTEM ENGINE LOOPS ---
        function gameLoop() {
            if (!isRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentGame === 'defender') {
                updateDefender();
                drawDefender();
            } else if (currentGame === 'snake') {
                updateSnake();
                drawSnake();
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isRunning = false;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0055';
            ctx.font = '30px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("SYSTEM CRASHED", canvas.width / 2, canvas.height / 2);
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText("Tap a menu button to restart", canvas.width / 2, canvas.height / 2 + 40);
        }

        function resetGames() {
            score = 0;
            scoreVal.innerText = score;
            isRunning = true;
            
            // Reset Defender
            player.x = 180;
            bullets = [];
            enemies = [];
            enemySpawnTimer = 0;

            // Reset Snake
            snake = [{ x: 160, y: 240 }, { x: 140, y: 240 }];
            dx = gridSize;
            dy = 0;
            generateFood();
        }

        function switchGame(gameType) {
            currentGame = gameType;
            document.getElementById('btn-defender').classList.toggle('active', gameType === 'defender');
            document.getElementById('btn-snake').classList.toggle('active', gameType === 'snake');
            resetGames();
        }

        // Start execution
        resetGames();
        gameLoop();
    </script>
</body>
</html>
